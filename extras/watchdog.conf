# /etc/systemd/system.conf.d/10-pi-watchdog.conf
# Installed by pi-overlay-toolkit extras. systemd pets the Pi's hardware
# watchdog; if the system hangs for 15s the board resets. 15s is the most the
# BCM2835 watchdog supports. RebootWatchdogSec covers a reboot that hangs.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
